[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/gubkin-labs/aleph"

[workspace.dependencies]
aleph-core = { path = "crates/aleph-core" }
base64 = "0.23"
hmac = "0.13"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
regex-lite = "0.1"
sha2 = "0.11"
proptest = "1.12"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ts-rs = "12.0"
wasm-bindgen = "=0.2.130"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
single_match_else = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
