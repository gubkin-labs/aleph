# Publishes an alpha release: the SDK, CLI, and their dependencies as tarballs on a GitHub release.
# Run it by hand from the Actions tab ("Release" → "Run workflow"). Nothing runs automatically.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.1.0-alpha.1 (tagged v<version>)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like 0.1.0-alpha.1, got '$VERSION'"
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::release v$VERSION already exists"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen (the version in Cargo.lock)
        run: |
          WB=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$WB" --locked

      # The same gate as `pnpm verify` locally: format, clippy, tests, codegen, lint, build.
      - name: Verify
        run: scripts/ci.sh

      - name: Pack
        run: node scripts/release-pack.mjs --version "$VERSION" --out release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" release/*.tgz \
            --target "$GITHUB_SHA" \
            --title "Aleph v$VERSION (alpha)" \
            --notes-file release/RELEASE_NOTES.md \
            --latest
