# Publishes a release to npm: @aleph-lang/manifest, core, sdk, and cli, then a GitHub release with
# the notes. Run it by hand from the Actions tab ("Release" → "Run workflow"). Nothing runs
# automatically.
#
# Needs an `NPM_TOKEN` repository secret: an npm granular access token that can publish to the
# @aleph-lang scope. (With npm trusted publishing configured for each package instead, the token
# can be removed.)
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 0.1.0 (tagged v<version>). A prerelease like 0.2.0-beta.1 is published under the npm tag "next".'
        required: true
        type: string

permissions:
  contents: write # the GitHub release and its tag
  id-token: write # npm provenance: links each package to this workflow run

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like 0.1.0, got '$VERSION'"
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::release v$VERSION already exists"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen (the version in Cargo.lock)
        run: |
          WB=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$WB" --locked

      # The same gate as `pnpm verify` locally: format, clippy, tests, codegen, lint, build.
      - name: Verify
        run: scripts/ci.sh

      - name: Pack
        run: node scripts/release-pack.mjs --version "$VERSION" --out release

      # Dependencies first. A package already published at this version is skipped, so a run that
      # failed halfway can be run again with the same version.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=next; fi
          while read -r file; do
            name=$(tar -xzOf "release/$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm, skipping"
              continue
            fi
            npm publish "./release/$file" --access public --provenance --tag "$TAG"
          done < release/publish-order.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Aleph v$VERSION" \
            --notes-file release/RELEASE_NOTES.md \
            $PRERELEASE
